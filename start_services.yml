---
# ============================================================
# 1. START INFINISPAN
# ============================================================

- name: Start Infinispan Node 1
  hosts: infinispan-node1
  gather_facts: no
  become: yes

  tasks:
    - name: Start Infinispan Node 1
      shell: /rlms/shell/infinispan_9.4.16/start_infinispan_node1.sh
      register: infinispan_node1_result

    - name: Display Infinispan Node 1 result
      debug:
        var: infinispan_node1_result.stdout


- name: Start Infinispan Node 2
  hosts: infinispan-node2
  gather_facts: no
  become: yes

  tasks:
    - name: Start Infinispan Node 2
      shell: /rlms/shell/infinispan_9.4.16/start_infinispan_node2.sh
      register: infinispan_node2_result

    - name: Display Infinispan Node 2 result
      debug:
        var: infinispan_node2_result.stdout


# ============================================================
# 2. START KAFKA 1
# ============================================================

